name: Vanuatu Smart Transport CI/CD Pipeline

on:
  push:
    branches: [ main, Staging ]
  pull_request:
    branches: [ main, Staging ]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout GitHub Repository Code
      uses: actions/checkout@v4

    # Setup a clean Node.js environment in the cloud
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-with: 20.x
        cache: 'npm'

    # Install the backend dependencies
    - name: Install Backend Dependencies
      run: npm install

    # Compile/check code for any fatal syntax errors
    - name: Run CI Build Check
      run: |
        echo "Building backend..."
        
    # Run automated testing suite (if you have npm test configured)
    - name: Run Automated Tests
      run: |
        echo "Running test suite..."
        # npm test --if-present