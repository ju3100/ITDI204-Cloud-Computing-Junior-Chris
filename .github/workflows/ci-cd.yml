name: CI

on:
  push:
    branches: [ main, Staging, staging ]
  pull_request:
    branches: [ main, Staging, staging ]
  workflow_dispatch: {}

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm install

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Frontend/build

  check-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run backend tests (if present)
        working-directory: backend
        run: npm test --if-present

  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: [build-frontend, check-backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "No deploy configured. Add provider-specific steps here."
