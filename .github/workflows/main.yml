name: CI Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Secret Validation ──
      - name: Verify Secrets Configuration
        shell: bash
        run: |
          echo "Checking repository secrets..."

          if [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "RENDER_API_KEY is securely configured!"
          else
            echo "RENDER_API_KEY is missing."
          fi

          if [ -n "${{ secrets.RENDER_BACKEND_SERVICE_ID }}" ]; then
            echo "RENDER_BACKEND_SERVICE_ID is securely configured!"
          else
            echo "RENDER_BACKEND_SERVICE_ID is missing."
          fi

          if [ -n "${{ secrets.RENDER_FRONTEND_SERVICE_ID }}" ]; then
            echo "RENDER_FRONTEND_SERVICE_ID is securely configured!"
          else
            echo "RENDER_FRONTEND_SERVICE_ID is missing."
          fi

          if [ -n "${{ secrets.REACT_APP_API_URL }}" ]; then
            echo "REACT_APP_API_URL is securely configured!"
          else
            echo "REACT_APP_API_URL is missing."
          fi

      # ── Project Checks ──
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        shell: bash
        run: |
          echo "Installing frontend dependencies..."
          if npm ci --no-audit --no-fund; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed, falling back to npm install"
            npm install --no-audit --no-fund
          fi
        working-directory: Frontend

      - name: Build frontend
        run: npm run build
        working-directory: Frontend
        env:
          CI: false

      - name: Run backend app
        run: |
          PORT=5000 node backend/server.js &
          echo $!

      - name: Wait for server
        run: sleep 3

      - name: Test backend API
        run: curl -f http://localhost:5000/

      - name: Stop server
        run: pkill node || true
